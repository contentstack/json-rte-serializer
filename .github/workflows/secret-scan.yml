name: Secret Scan
on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [master]
jobs:
  secret-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # Shallow, single-branch checkout: only the tip commit of the branch
      # under test, no commit history. The scan is a filesystem scan of the
      # working tree, so history would be fetched bandwidth for nothing.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install trufflehog
        run: |
          curl -sSfL https://raw.githubusercontent.com/trufflesecurity/trufflehog/main/scripts/install.sh \
            | sh -s -- -b /usr/local/bin
          trufflehog --version

      # Runs the same script as the local husky hooks, so CI and the developer
      # machine cannot drift apart. Scans the whole checked-out filesystem
      # rather than the PR diff: a secret already present on the branch is a
      # leak whether or not this PR is the commit that introduced it.
      - name: Scan filesystem for secrets
        run: sh scripts/trufflehog-scan.sh ci
